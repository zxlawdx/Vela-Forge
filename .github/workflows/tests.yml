name: Forge tests
on: [push, pull_request]
jobs:
  unit-and-http:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v
      - name: JavaScript syntax
        run: python -c "import pathlib,subprocess; [subprocess.run(['node','--check',str(p)],check=True) for p in pathlib.Path('apps/forge/static/js').rglob('*.js')]"
      - run: git diff --check
  godot-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install official Godot 4.5 stable
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5-stable_linux.x86_64"
          echo "FORGE_GODOT=$RUNNER_TEMP/godot/Godot_v4.5-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: python -m pytest -v tests/engines -k godot
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python tests/browser/run.py
