<aside class="vf-left-pane">

  <section class="vf-pane-section">

    <div class="vf-pane-head">
      Quick Actions
    </div>

    <div class="vf-action-stack">

      <button data-action="edit-nodes">
        Edit Nodes
      </button>

      <button
        id="vf-create-node"
        data-action="create-node"
      >
        Create Node
      </button>

      <button data-action="generate-animation">
        Generate Animation
      </button>

    </div>

  </section>


  <section class="vf-pane-section">

    <div class="vf-pane-head">
      Items
    </div>

    <div class="vf-item-list">

      <button data-item-view="variables">
        Variables
      </button>

      <button data-item-view="data">
        Datas
      </button>

      <button data-item-view="assets">
        Assets
      </button>

      <button data-item-view="events">
        Events
      </button>

    </div>

  </section>


  <section class="vf-pane-section vf-library-section">

    <div class="vf-pane-head">
      Node Library
    </div>

    <div class="vf-library-search">

      <input
        id="vf-node-search"
        type="text"
        placeholder="Search nodes..."
      >

    </div>


    <div
      class="vf-library-list"
      id="vf-node-library"
    >

      <button
        class="vf-library-node"
        data-name="Start"
        data-type="start"
      >
        <span class="vf-dot vf-dot--flow"></span>
        Start
      </button>


      <button
        class="vf-library-node"
        data-name="End"
        data-type="end"
      >
        <span class="vf-dot vf-dot--flow"></span>
        End
      </button>


      <button
        class="vf-library-node"
        data-name="Dialogue"
        data-type="dialogue"
      >
        <span class="vf-dot vf-dot--dialogue"></span>
        Dialogue
      </button>


      <button
        class="vf-library-node"
        data-name="Choice"
        data-type="choice"
      >
        <span class="vf-dot vf-dot--dialogue"></span>
        Choice
      </button>


      <button
        class="vf-library-node"
        data-name="Branch"
        data-type="branch"
      >
        <span class="vf-dot vf-dot--logic"></span>
        Branch
      </button>


      <button
        class="vf-library-node"
        data-name="Set Variable"
        data-type="set-variable"
      >
        <span class="vf-dot vf-dot--logic"></span>
        Set Variable
      </button>


      <button
        class="vf-library-node"
        data-name="Emit Event"
        data-type="event"
      >
        <span class="vf-dot vf-dot--event"></span>
        Emit Event
      </button>

    </div>

  </section>


  <button
    class="vf-profile-btn"
    data-action="profile"
  >
    Profile
  </button>

</aside>
