<aside class="vf-right-pane">

  <div class="vf-inspector-tabs">

    <button
      class="active"
      data-inspector-tab="node"
    >
      Inspector
    </button>

    <button data-inspector-tab="graph">
      Graph
    </button>

  </div>


  <div class="vf-inspector">

    <div class="vf-inspector-title">

      <span class="vf-big-dot"></span>

      <div>

        <strong id="vf-inspector-type">
          No selection
        </strong>

        <span id="vf-inspector-id">
          Select a node
        </span>

      </div>

    </div>


    <div class="vf-section-title">
      Properties
    </div>


    <label class="vf-field">

      <span>
        Actor
      </span>

      <input
        id="vf-actor-input"
        placeholder="Penguin"
        disabled
      >

    </label>


    <label class="vf-field">

      <span>
        Text
      </span>

      <textarea
        id="vf-text-input"
        placeholder="Dialogue text..."
        disabled
      ></textarea>

    </label>


    <div class="vf-section-title">
      Ports
    </div>


    <div
      class="vf-chips"
      id="vf-port-chips"
    >

      <span class="vf-chip">
        none
      </span>

    </div>


    <div class="vf-section-title">
      Metadata
    </div>


    <label class="vf-field">

      <span>
        Stable ID
      </span>

      <input
        id="vf-stable-id"
        disabled
      >

    </label>


    <label class="vf-field">

      <span>
        Comment
      </span>

      <textarea
        id="vf-node-comment"
        placeholder="Optional development note..."
      ></textarea>

    </label>

  </div>

</aside>
